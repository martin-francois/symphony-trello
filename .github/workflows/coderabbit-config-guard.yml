name: CodeRabbit configuration guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  coderabbit-config-guard:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      # The base-branch workflow reads metadata only. It checks out its script at a base-branch
      # commit and never checks out or runs PR code.
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip, never the pull request.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/coderabbit-config-guard.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Restrict CodeRabbit configuration changes to the owner
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/coderabbit-config-guard.cjs")({ github, context, core });
