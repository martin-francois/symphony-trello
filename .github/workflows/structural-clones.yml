name: Structural clone detection

on:
  pull_request:
    paths:
      - "src/main/java/**/*.java"
      - "src/test/java/**/*.java"
      - "config/nil/**"
      - "scripts/nil-clone-detection.*"
      - ".github/workflows/structural-clones.yml"
  push:
    branches:
      - main
    paths:
      - "src/main/java/**/*.java"
      - "src/test/java/**/*.java"
      - "config/nil/**"
      - "scripts/nil-clone-detection.*"
      - ".github/workflows/structural-clones.yml"

permissions: read-all

jobs:
  nil:
    name: NIL near-miss clones
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Build and run NIL
        run: node scripts/nil-clone-detection.mjs
      - name: Upload normalized clone report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nil-clone-report
          path: target/nil-clones/report.json
          if-no-files-found: ignore
          retention-days: 14
