name: size-labeler
# pull_request_target covers forks, conflicts, and skip directives without executing PR code.
# Commitlint covers ordinary PRs whose paths are ignored below. The schedule reconciles the
# residual case where GitHub suppresses Commitlint and every changed path is ignored here.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - install.ps1
      - install.sh
      - pom.xml
  workflow_run:
    workflows: [Commitlint]
    types: [completed]
    branches-ignore:
      - release-please--branches--**
  schedule:
    - cron: "7 * * * *"

permissions: read-all

jobs:
  resolve_pull_requests:
    if: >-
      ${{
        github.event_name == 'pull_request_target' ||
        github.event_name == 'schedule' ||
        github.event.workflow_run.event == 'pull_request'
      }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      issue_numbers: ${{ steps.resolve.outputs.issue_numbers }}
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on workflow_run and schedule.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/size-labeler-resolve-pull-requests.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve pull requests from trusted event metadata
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/size-labeler-resolve-pull-requests.cjs")({ github, context, core });

  sync-size-label:
    needs: resolve_pull_requests
    if: >-
      ${{
        needs.resolve_pull_requests.outputs.issue_numbers != '' &&
        needs.resolve_pull_requests.outputs.issue_numbers != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.resolve_pull_requests.outputs.issue_numbers) }}
    concurrency:
      group: size-labeler-${{ matrix.issue_number }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on workflow_run and schedule.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/size-labeler-sync-size-label.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Apply size label from changed lines
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ matrix.issue_number }}
        with:
          script: |
            await require("./scripts/size-labeler-sync-size-label.cjs")({ github, context, core });
