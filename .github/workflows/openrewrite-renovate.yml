name: OpenRewrite Renovate automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, edited, labeled, unlabeled]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Renovate pull request number; leave empty to reconcile every open candidate
        required: false
        type: string

permissions: read-all

env:
  GENERATED_BRANCH_PREFIX: automation/openrewrite/renovate-

jobs:
  invalidate-derived-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/openrewrite-renovate-invalidate-derived-source.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Invalidate stale generated source
        if: >-
          ${{
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'renovate/openrewrite-toolchain' &&
            github.event.pull_request.user.login == 'renovate[bot]'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/openrewrite-renovate-invalidate-derived-source.cjs")({ github, context, core });

  verify-derived-source:
    if: >-
      ${{
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/openrewrite-renovate-verify-derived-source.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify current Renovate source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/openrewrite-renovate-verify-derived-source.cjs")({ github, context, core });

  attest-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/openrewrite-renovate-attest-source.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Attest the Renovate source sender
        if: >-
          ${{
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'renovate/openrewrite-toolchain' &&
            github.event.pull_request.user.login == 'renovate[bot]'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/openrewrite-renovate-attest-source.cjs")({ github, context, core });

  resolve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pull_request_numbers: ${{ steps.candidates.outputs.pull_request_numbers }}
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/openrewrite-renovate-resolve.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve OpenRewrite Renovate pull requests
        id: candidates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_PULL_REQUEST: ${{ inputs.pull_request_number }}
        with:
          script: |
            await require("./scripts/openrewrite-renovate-resolve.cjs")({ github, context, core });

  invalidate-reconciled-source:
    needs: [resolve, attest-source, invalidate-derived-source]
    if: >-
      ${{
        needs.resolve.outputs.pull_request_numbers != '' &&
        needs.resolve.outputs.pull_request_numbers != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve.outputs.pull_request_numbers) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/openrewrite-renovate-invalidate-reconciled-source.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Invalidate generated result before reconciliation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
        with:
          script: |
            await require("./scripts/openrewrite-renovate-invalidate-reconciled-source.cjs")({ github, context, core });

  generate:
    needs: [resolve, invalidate-reconciled-source]
    if: >-
      ${{
        needs.resolve.outputs.pull_request_numbers != '' &&
        needs.resolve.outputs.pull_request_numbers != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve.outputs.pull_request_numbers) }}
    concurrency:
      group: openrewrite-renovate-generate-${{ matrix.pull_request_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/openrewrite-renovate-validate-source.cjs
            scripts/openrewrite-renovate-materialize-pom.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate source pull request metadata
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
        with:
          script: |
            await require("./scripts/openrewrite-renovate-validate-source.cjs")({ github, context, core });

      - name: Checkout trusted automation source
        if: ${{ steps.source.outputs.state == 'open' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ steps.source.outputs.base_sha }}

      - name: Checkout trusted execution source
        if: ${{ steps.source.outputs.state == 'open' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          ref: ${{ steps.source.outputs.base_sha }}

      - name: Materialize the exact Renovate POM
        if: ${{ steps.source.outputs.state == 'open' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        with:
          script: |
            await require("./scripts/openrewrite-renovate-materialize-pom.cjs")({ github, context, core });

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.source.outputs.state == 'open' }}
        with:
          node-version: "26"

      - name: Validate the dependency-only update
        id: dependency
        if: ${{ steps.source.outputs.state == 'open' }}
        env:
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node trusted/scripts/openrewrite-renovate.ts validate-update \
            trusted/pom.xml \
            source/pom.xml \
            "$SOURCE_PULL_REQUEST" \
            "$SOURCE_SHA" \
            "$RUNNER_TEMP/openrewrite-metadata.json"

      - name: Establish the validated Renovate tree as the local baseline
        if: ${{ steps.source.outputs.state == 'open' }}
        working-directory: source
        run: |
          git add pom.xml
          git \
            -c user.name="openrewrite-validation[bot]" \
            -c user.email="openrewrite-validation[bot]@users.noreply.github.com" \
            commit --no-gpg-sign -m "chore(deps): establish validated OpenRewrite source"

      - name: Generate and verify the ordered maintenance state
        id: maintenance
        if: ${{ steps.source.outputs.state == 'open' }}
        working-directory: source
        env:
          OPENREWRITE_IMAGE: >-
            docker.io/library/maven:3.9.11-eclipse-temurin-25@sha256:407c4423cec0cf2981055bc2c6c0dc211d9605b6669279b95997f2d1c7e91e2c
        run: ../trusted/scripts/run-openrewrite-maintenance

      - name: Classify the verified result
        id: result
        if: ${{ steps.source.outputs.state == 'open' }}
        run: trusted/scripts/classify-openrewrite-result

      - name: Write reconciliation state
        if: ${{ always() }}
        env:
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          GENERATED_CHANGES: ${{ steps.result.outputs.generated_changes }}
          MAINTENANCE_OUTCOME: ${{ steps.maintenance.outcome }}
          RESULT_OUTCOME: ${{ steps.result.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_STATE: ${{ steps.source.outputs.state }}
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
        run: trusted/scripts/write-openrewrite-reconciliation-state

      - name: Upload verified reconciliation state
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrewrite-renovate-${{ matrix.pull_request_number }}
          path: ${{ runner.temp }}/openrewrite-artifact
          if-no-files-found: error
          retention-days: 1

  report-source-validation:
    needs: [resolve, generate]
    if: >-
      ${{
        always() &&
        needs.resolve.outputs.pull_request_numbers != '' &&
        needs.resolve.outputs.pull_request_numbers != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve.outputs.pull_request_numbers) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on schedule, the dispatched branch's tip on workflow_dispatch.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openrewrite-renovate-${{ matrix.pull_request_number }}
          path: ${{ runner.temp }}/openrewrite-artifact

      - name: Validate the status-report artifact
        id: artifact
        run: scripts/validate-openrewrite-status-artifact

      - name: Report source validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATED_CHANGES: ${{ steps.artifact.outputs.generated_changes }}
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
          VALIDATION_PASSED: ${{ steps.artifact.outputs.validation_passed }}
        with:
          script: |
            await require("./scripts/openrewrite-renovate-report-source-validation.cjs")({ github, context, core });

  publish:
    needs: [resolve, generate, report-source-validation]
    if: >-
      ${{
        always() &&
        needs.resolve.outputs.pull_request_numbers != '' &&
        needs.resolve.outputs.pull_request_numbers != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve.outputs.pull_request_numbers) }}
    concurrency:
      group: openrewrite-renovate-publish-${{ matrix.pull_request_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openrewrite-renovate-${{ matrix.pull_request_number }}
          path: ${{ runner.temp }}/openrewrite-artifact

      - name: Determine whether publication access is required
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
        run: scripts/require-openrewrite-publication

      - name: Create short-lived automation token
        if: ${{ steps.publication.outputs.required == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OPENREWRITE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OPENREWRITE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.publication.outputs.required == 'true' }}
        with:
          node-version: "26"

      - name: Checkout trusted publication source
        if: ${{ steps.publication.outputs.required == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Publish or remove the generated pull request
        if: ${{ steps.publication.outputs.required == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_PULL_REQUEST: ${{ matrix.pull_request_number }}
          STATUS_TOKEN: ${{ github.token }}
        run: scripts/publish-openrewrite-result