name: Continuous Fuzzing Watchdog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/continuous-fuzzing-watchdog.yml
      - .github/workflows/continuous-fuzzing.yml
      - scripts/continue-clusterfuzzlite-batch
      - scripts/ensure-clusterfuzzlite-running
  workflow_run:
    workflows:
      - Continuous Fuzzing
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: continuous-fuzzing-watchdog
  cancel-in-progress: false

jobs:
  ensure-running:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == 'main'
      && startsWith(github.event.workflow_run.display_title, 'Continuous batch cycle ')
      && github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out watchdog script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure continuous fuzzing is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ensure-clusterfuzzlite-running
