name: pull-request-author-handoff
# Both event families execute the workflow from the default branch. The privileged job reads only
# trusted event metadata and GitHub API responses. Its one checkout is the script file at a
# base-branch commit; it never checks out pull-request code.

on:
  pull_request_target:
    types: [labeled, synchronize, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  sync-handoff:
    if: >-
      ${{
        (github.event_name == 'pull_request_target' &&
          ((github.event.action == 'labeled' &&
           github.event.label.name == 'waiting-for-author') ||
           (github.event.action != 'labeled' &&
            github.event.sender.login == github.event.pull_request.user.login &&
            contains(github.event.pull_request.labels.*.name, 'waiting-for-author')))) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login == github.event.issue.user.login &&
          github.event.comment.body == '/ready' &&
          contains(github.event.issue.labels.*.name, 'waiting-for-author'))
      }}
    concurrency:
      group: pull-request-author-handoff-${{ github.event.pull_request.number || github.event.issue.number }}
      # GitHub's queue mode preserves bursts of meaningful state transitions for this PR.
      queue: max
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on issue_comment.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pull-request-author-handoff.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Synchronize author handoff labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/pull-request-author-handoff.cjs")({ github, context, core });
