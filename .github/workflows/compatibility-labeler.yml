name: compatibility-labeler
# Uses pull_request_target so repository admins can approve fork PR runs when needed.
# Execution is limited to metadata reads and label API calls. The one checkout is the script file
# at a base-branch commit, never pull-request code.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    # pull_request_target does not honor [skip ci]. Release Please only changes these files.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - install.ps1
      - install.sh
      - pom.xml
  issues:
    types: [opened, edited]

permissions: read-all

jobs:
  sync-breaking-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Check out the workflow script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this workflow file was read from: the base branch tip on pull_request_target,
          # the default branch tip on issues.
          ref: ${{ github.sha }}
          sparse-checkout: scripts/compatibility-labeler.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Apply breaking change label from template selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./scripts/compatibility-labeler.cjs")({ github, context, core });
