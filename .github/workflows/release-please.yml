name: Release Please

on:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  # Release Please force-pushes its branch and the breaking-changes step writes to it afterwards, so
  # two runs must not interleave. Queued runs wait; a newer push replaces a queued run.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-26.04
    outputs:
      upload_assets: ${{ steps.release-assets.outputs.upload_assets }}
      checkout_ref: ${{ steps.release-assets.outputs.checkout_ref }}
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The breaking-changes step reads every commit since the last release tag.
          fetch-depth: 0
      - name: Release Please
        if: ${{ github.event_name == 'push' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; packages release-please ^17.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release asset upload target
        id: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: scripts/resolve-release-asset-target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release-assets.outputs.upload_assets == 'true' }}
        with:
          node-version: "26"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release-assets.outputs.upload_assets == 'true' }}
      - name: Install script dependencies
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release-assets.outputs.upload_assets == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Checkout release source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        with:
          ref: ${{ steps.release-assets.outputs.checkout_ref }}
          path: target/release-source
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        with:
          distribution: temurin
          java-version: "25.0.4+7.0.LTS"
          cache: maven
      - name: Build release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
          RELEASE_SOURCE_ROOT: ${{ steps.release-assets.outputs.source_root }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/build-release-assets
      - name: Attest release assets
        id: attest-release-assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-assets.outputs.asset_dir }}/*
          create-storage-record: false
      - name: Add release provenance asset
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
          PROVENANCE_BUNDLE: ${{ steps.attest-release-assets.outputs.bundle-path }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/add-release-provenance
      - name: Verify release signatures
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/verify-release-signatures
      - name: Upload release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
        run: scripts/upload-release-assets
      - name: Verify release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/verify-release-assets
      - name: Verify breaking changes in the release
        # The github changelog type leaves out BREAKING CHANGE footers (ADR 0135).
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
        run: node scripts/release-breaking-changes.ts release
      - name: Publish release
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Add breaking changes to the release pull request
        # Runs after the release steps so a failure here never holds back a release.
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: node scripts/release-breaking-changes.ts pull-request

  maven-central:
    name: Publish Maven Central artifacts
    needs: release-please
    # Off until the owner sets the MAVEN_CENTRAL_STAGE repository variable (CONTRIBUTING.md).
    if: ${{ needs.release-please.outputs.upload_assets == 'true' && vars.MAVEN_CENTRAL_STAGE != '' }}
    runs-on: ubuntu-26.04
    environment: maven-central
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4+7.0.LTS"
      - name: Stage Maven Central artifacts
        run: scripts/stage-maven-central-artifacts
      - name: Deploy to Maven Central
        env:
          JRELEASER_MAVENCENTRAL_STAGE: ${{ vars.MAVEN_CENTRAL_STAGE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: scripts/deploy-maven-central
