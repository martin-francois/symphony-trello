name: Release Please

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release Please
        if: ${{ github.event_name == 'push' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; packages release-please ^17.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release asset upload target
        id: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: scripts/resolve-release-asset-target
      - name: Checkout release source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        with:
          ref: ${{ steps.release-assets.outputs.checkout_ref }}
          path: target/release-source
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
          RELEASE_SOURCE_ROOT: ${{ steps.release-assets.outputs.source_root }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/build-release-assets
      - name: Attest release assets
        id: attest-release-assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-assets.outputs.asset_dir }}/*
          create-storage-record: false
      - name: Add release provenance asset
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
          PROVENANCE_BUNDLE: ${{ steps.attest-release-assets.outputs.bundle-path }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/add-release-provenance
      - name: Upload release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
          ASSET_DIR: ${{ steps.release-assets.outputs.asset_dir }}
        run: scripts/upload-release-assets
      - name: Verify release assets
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release-assets.outputs.version }}
        run: scripts/verify-release-assets
      - name: Publish release
        if: ${{ steps.release-assets.outputs.upload_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-assets.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
