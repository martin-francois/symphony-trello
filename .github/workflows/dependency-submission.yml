name: Dependency Submission

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'pom.xml'
      - '.github/workflows/dependency-submission.yml'
      - '.mvn/jvm.config'

permissions: read-all

jobs:
  dependency-submission:
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--')
      && github.head_ref != 'renovate/openrewrite-toolchain'
      && !startsWith(github.head_ref, 'automation/openrewrite/renovate-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Submit Dependencies
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
