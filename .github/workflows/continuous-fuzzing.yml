name: Continuous Fuzzing
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && inputs.operation == 'batch'
    && inputs.continue_fuzzing
    && format('Continuous batch cycle {0}', inputs.cycle_index)
    || format('{0} by {1}', github.event_name, github.actor)
  }}

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Keep the watchdog on the established fuzz workflow, whose scheduled trigger has live evidence.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "ClusterFuzzLite operation to run."
        required: true
        type: choice
        default: batch
        options:
          - batch
          - prune
          - coverage
          - build
      fuzz_seconds:
        description: "Per-target batch budget; continuous cycles use 4500 or 4950 seconds."
        required: true
        type: number
        default: 300
      continue_fuzzing:
        description: "Dispatch another long batch after this batch completes."
        required: true
        type: boolean
        default: false
      cycle_index:
        description: "Internal zero-based cycle index; cycle 3 includes daily maintenance."
        required: true
        type: number
        default: 0

permissions: read-all

concurrency:
  group: >-
    continuous-fuzzing-${{
      (github.event_name == 'workflow_dispatch'
      && (inputs.operation == 'batch' || inputs.operation == 'prune'))
      && 'corpus-main'
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  code-change:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    concurrency:
      group: continuous-fuzzing-code-change-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build affected fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: https://github.com/martin-francois/symphony-trello-fuzzing-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      - name: Fuzz the code change
        id: fuzz
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          language: jvm
          minimize-crashes: true
          mode: code-change
          output-sarif: true
          sanitizer: address
          storage-repo: https://github.com/martin-francois/symphony-trello-fuzzing-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      - name: Upload fuzzing result to code scanning
        if: >-
          !cancelled()
          && steps.fuzz.outcome == 'failure'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: cifuzz-sarif/results.sarif
      - name: Fail after publishing the fuzzing result
        if: ${{ !cancelled() && steps.fuzz.outcome == 'failure' }}
        run: exit 1

  continuous-build:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build'))
    concurrency:
      group: continuous-fuzzing-build-main
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build and retain fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-build: true

  watchdog:
    if: github.event_name == 'schedule'
    concurrency:
      group: continuous-fuzzing-watchdog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out watchdog script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure continuous fuzzing is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ensure-clusterfuzzlite-running

  batch:
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'workflow_dispatch'
      && inputs.operation == 'batch'
    strategy:
      fail-fast: false
      # ClusterFuzzLite pushes every target corpus to one Git branch. One writer at a time prevents
      # non-fast-forward races and retains every target's inputs.
      max-parallel: 1
      matrix:
        target:
          - RepositorySourceFuzzer
          - TrelloCardReferenceParserFuzzer
          - TrelloChecklistClassifierFuzzer
          - WorkflowLoaderFuzzer
    concurrency:
      group: continuous-fuzzing-batch-main-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      issues: write
      security-events: write
    steps:
      - name: Check out fuzzing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select one fuzz target for complete crash reporting
        run: scripts/select-clusterfuzzlite-target "${{ matrix.target }}"
      - name: Run batch fuzzing
        id: fuzz
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ inputs.fuzz_seconds }}
          language: jvm
          minimize-crashes: true
          mode: batch
          output-sarif: true
          sanitizer: address
          storage-repo: https://${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}@github.com/martin-francois/symphony-trello-fuzzing-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      - name: Verify corpus persistence
        if: ${{ !cancelled() && steps.fuzz.outcome == 'success' }}
        env:
          CFL_STORAGE_REPOSITORY: martin-francois/symphony-trello-fuzzing-storage
          GH_TOKEN: ${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}
        run: scripts/verify-clusterfuzzlite-storage corpus "${{ matrix.target }}"
      - name: Upload fuzzing result to code scanning
        if: >-
          !cancelled()
          && steps.fuzz.outcome == 'failure'
          && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: clusterfuzzlite-${{ matrix.target }}
          sarif_file: cifuzz-sarif/results.sarif
      - name: Create or update fuzz failure issue
        if: >-
          !cancelled()
          && steps.fuzz.outcome == 'failure'
        env:
          CFL_CRASH_ARTIFACT: crashes-${{ matrix.target }}
          CFL_SARIF_FILE: cifuzz-sarif/results.sarif
          CFL_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-clusterfuzzlite-failure
      - name: Fail after publishing the fuzzing result
        if: ${{ !cancelled() && steps.fuzz.outcome == 'failure' }}
        run: exit 1

  prune:
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'prune')
      || (github.event_name == 'workflow_dispatch'
      && inputs.operation == 'batch'
      && inputs.continue_fuzzing
      && inputs.cycle_index == 3))
    needs: batch
    concurrency:
      group: continuous-fuzzing-prune-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out fuzzing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune fuzzing corpora
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          language: jvm
          mode: prune
          sanitizer: address
          storage-repo: https://${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}@github.com/martin-francois/symphony-trello-fuzzing-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      - name: Verify pruned corpus persistence
        env:
          CFL_STORAGE_REPOSITORY: martin-francois/symphony-trello-fuzzing-storage
          GH_TOKEN: ${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}
        run: >-
          scripts/verify-clusterfuzzlite-storage corpus
          RepositorySourceFuzzer
          TrelloCardReferenceParserFuzzer
          TrelloChecklistClassifierFuzzer
          WorkflowLoaderFuzzer

  coverage:
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'coverage')
      || (github.event_name == 'workflow_dispatch'
      && inputs.operation == 'batch'
      && inputs.continue_fuzzing
      && inputs.cycle_index == 3))
    needs: batch
    concurrency:
      group: continuous-fuzzing-coverage-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out fuzzing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers for coverage
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 25 for the coverage wrapper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Generate and publish Java 25 fuzzing coverage
        env:
          GIT_STORE_REPO: https://${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}@github.com/martin-francois/symphony-trello-fuzzing-storage.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/run-clusterfuzzlite-coverage
      - name: Verify coverage persistence
        env:
          CFL_STORAGE_REPOSITORY: martin-francois/symphony-trello-fuzzing-storage
          GH_TOKEN: ${{ secrets.CLUSTERFUZZLITE_STORAGE_TOKEN }}
        run: scripts/verify-clusterfuzzlite-storage coverage

  continue-batch:
    if: >-
      always()
      && !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.batch.result == 'success'
      && (github.event_name == 'workflow_dispatch'
      && inputs.operation == 'batch'
      && inputs.continue_fuzzing)
    needs: [batch, prune, coverage]
    concurrency:
      group: continuous-fuzzing-continuation-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out continuation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch successor batch
        env:
          CFL_CYCLE_INDEX: ${{ inputs.cycle_index }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/continue-clusterfuzzlite-batch
