# Distribution defaults for optional installation telemetry. The capture endpoint is fixed in
# TelemetryDistribution; this file carries only the public capture token of the dedicated
# "Symphony for Trello" PostHog project. It stays <unset> in the repository, so source checkouts,
# tests, CI, and development builds can never send. The release workflow writes the token from the
# POSTHOG_PROJECT_TOKEN repository secret into this file while packaging the release archives.
posthog.project-token=<unset>
