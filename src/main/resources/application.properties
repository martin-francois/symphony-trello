quarkus.application.name=symphony-trello
quarkus.http.host=127.0.0.1
quarkus.http.port=${SYMPHONY_HTTP_PORT:18080}
quarkus.log.category."ch.fmartin.symphony.trello".level=INFO
symphony.workflow.path=${SYMPHONY_WORKFLOW_PATH:WORKFLOW.md}
symphony.autostart=${SYMPHONY_AUTOSTART:true}
# Platform detection for telemetry uses the Foreign Function and Memory API; declaring native access
# in the runner manifest keeps `java -jar` runs free of the JDK restricted-method warning.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED
