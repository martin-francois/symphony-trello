  - id: install-dry-run-custom-prefix
    family: cleanup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: install.sh --dry-run with a custom prefix plans without writing.
    setup: Run-scoped HOME, XDG, SYMPHONY_HOME, prefix, and bin dir.
    action: Run install.sh --dry-run --no-onboard --no-update-path --prefix <prefix> --bin-dir <bin>.
    assertions:
      - the dry run exits 0 and prints WOULD lines
      - neither the prefix nor the bin dir is created
    cleanup: None.
    expected: covered

  - id: uninstall-dry-run-custom-prefix-safety
    family: cleanup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: uninstall.sh --dry-run with a custom prefix removes nothing.
    setup: A run-scoped fake prefix and bin dir with marker files.
    action: Run uninstall.sh --dry-run --prefix <prefix> --bin-dir <bin>.
    assertions:
      - the dry run exits 0
      - every marker file still exists afterwards
    cleanup: None.
    expected: covered

  - id: interim-real-trello-board-cleanup
    family: cleanup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: cleanup
    harness_only: true
    description: A registered disposable board can be archived mid-run and archiving again is safe.
    setup: Create and register one disposable board.
    action: Archive it through the registry, then archive it again.
    assertions:
      - the board is closed after the first archive
      - the second archive succeeds without error
      - archiving an unregistered board id is refused
    cleanup: None; the board is already archived.
    expected: covered

  - id: final-trello-board-cleanup
    family: cleanup
    profiles: [quick, release, trello-live, real-codex, github-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: cleanup
    harness_only: true
    description: Final cleanup stops registered workers and archives every registered board.
    setup: The run's registries.
    action: Run the cleanup routine.
    assertions:
      - every registered board is closed
      - no run-owned process remains
    cleanup: This row is the cleanup.
    expected: covered

  - id: final-cleanup-verification
    family: cleanup
    profiles: [quick, release, trello-live, real-codex, github-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: cleanup
    harness_only: true
    description: Running cleanup again changes nothing, which proves the first pass was complete.
    setup: The run after final-trello-board-cleanup.
    action: Run the cleanup routine again and list run-owned processes.
    assertions:
      - the second pass archives no board and stops no worker
      - no run-owned process remains
    cleanup: None.
    expected: covered

  - id: private-context-scan-public-reports-and-drafts
    family: diagnostics
    profiles: [quick, release, trello-live, real-codex, github-live, soak]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: cleanup
    harness_only: true
    description: scripts/check-private-context finds nothing in the public reports and issue drafts.
    setup: The run's public progress, ledger, cleanup summary, and issue drafts.
    action: Run scripts/check-private-context --file for each public file.
    assertions:
      - the scan exits 0
    cleanup: None.
    expected: covered
    notes: Runs after cleanup so the cleanup summary is scanned too. The final report is scanned after it is written; the result is printed and changes the exit code.

  - id: passive-soak-trello-auth-board-process-codex-sentinel
    family: soak
    profiles: [soak]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: soak
    description: Passive health loop after cleanup until a duration or hard stop.
    setup: A finished run, or a fresh run whose registries are empty.
    action: Every interval, check Trello auth with list-workspaces, query every registered board, scan for run-owned processes, and run the Codex sentinel when --codex real.
    assertions:
      - every cycle reports zero Trello failures, board query failures, open run-owned boards, run-owned processes, and Codex sentinel failures
    cleanup: None.
    expected: covered
    notes: Needs --soak-duration or --soak-until. Without --codex real the sentinel column reports not-run.
