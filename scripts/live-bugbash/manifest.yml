# Live bug-bash scenario manifest. Each row is one stable scenario id with its requirements,
# expected status, and linked issue. scripts/live-bugbash/run.sh reads this file; the automation for
# a row lives in scripts/live-bugbash/scenarios/<family>.ts under the same id. Rows without
# automation are reported as not-yet-automated, never as passes.
#
# Field reference: docs/live-bugbash.md#manifest-rows
version: 1

defaults:
  evidence:
    public: coverage-ledger row with a sanitized evidence summary
    private: target/live-bugbash/<run-id>/private-evidence/<scenario-id>/

scenarios:
  # ---------------------------------------------------------------------------------------------
  # Setup and onboarding
  # ---------------------------------------------------------------------------------------------
  - id: source-install
    family: setup
    profiles: [quick, release, trello-live]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: The documented source install builds the current commit and installs a callable wrapper.
    setup: Point HOME, XDG, and SYMPHONY_HOME at run-scoped sandboxes; keep the operator Maven cache.
    action: Run install.sh --from-source --repo <checkout> --ref <commit> --no-onboard --no-update-path with a run-scoped prefix and bin dir, then symphony-trello --version.
    assertions:
      - install exits 0
      - the installed wrapper exists and --version exits 0 with a version line
      - install output does not print Trello credentials
    cleanup: The run root keeps the install; nothing outside it is written.
    expected: covered
    notes: Skipped when --symphony-command selects an existing install.

  - id: installed-wrapper-trello-auth
    family: setup
    profiles: [quick, release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: The installed wrapper authenticates against Trello with run-scoped credentials.
    setup: Pass the selected Trello target's credentials through the environment only.
    action: Run symphony-trello list-workspaces --endpoint <endpoint>.
    assertions:
      - list-workspaces exits 0 and lists at least one Workspace
      - output does not contain the Trello key or token
    cleanup: None; the command is read-only.
    expected: covered
    notes: The original run once read the project-root .env instead of the installed config .env; this row reads credentials from the run environment only.

  - id: new-board-real-trello
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: new-board creates the recommended board and writes a workflow under the run root.
    setup: Use a run-scoped workflow path and a board name that starts with the run id.
    action: Run symphony-trello new-board --name <run-id>-new-board-real-trello --no-github --endpoint <endpoint> --workflow <run-root workflow>.
    assertions:
      - new-board exits 0 and the board is registered as run-owned
      - the board has the recommended lists
      - the workflow is written under the run root and names the new board
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: import-board-custom-real-trello
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: import-board keeps repeated and comma-containing list selectors exactly.
    setup: Create a disposable board with custom lists, including a comma-containing list name.
    action: Run import-board with repeated --active and --terminal selectors plus --in-progress and --blocked.
    assertions:
      - import-board exits 0
      - tracker.active_states keeps every repeated active selector in order, including the comma-containing name
      - tracker.terminal_states contains every repeated terminal selector
      - tracker.in_progress_state and tracker.blocked_state use the exact list names
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: setup-local-create-board
    family: setup
    profiles: [quick, release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: Non-interactive setup-local creates a board, workflow, and manifest without starting a worker.
    setup: Run-scoped config dir, env file, manifest, workflow, workspace root, and free port.
    action: Run setup-local --non-interactive --no-start --no-github --force with a run-id board name.
    assertions:
      - setup-local exits 0
      - the workflow and connected-board manifest are written under the run root
      - no worker process starts because --no-start is set
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: setup-local-check-running-board
    family: setup
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: setup-local check reports a connected, running board as healthy.
    setup: Connect a board with import-board and start its worker with fake Codex.
    action: Run setup-local check --endpoint <endpoint> against the run-scoped config dir.
    assertions:
      - setup-local check exits 0
      - the check names the connected workflow and reports no port conflict or credential failure
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: configure-github-existing-board
    family: setup
    profiles: [github-live]
    requires: {trello: true, codex: false, github: true, network: true}
    mode: github-sandbox
    description: setup-local configure-github adds the pull-request flow to an existing connected board.
    setup: Connect a Trello-only board and create a private sandbox repository named with the run id.
    action: Run setup-local configure-github --board <selector> with the sandbox repository URL.
    assertions:
      - configure-github exits 0
      - the workflow gains the GitHub pull-request lists and prompt sections
      - no existing repository is written
    cleanup: Archive the board; list the sandbox repository for manual deletion.
    expected: covered

  - id: import-board-missing-list-selector-before-attached-option
    family: setup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: import-board rejects --active without a value when the next token is an attached option.
    setup: Run-scoped workflow and env paths that do not exist yet.
    action: Run import-board --board <id> --active --terminal=Released --workflow <workflow> --env <env>.
    assertions:
      - the command fails with setup_failed code=setup_invalid_arguments
      - the message says Expected parameter for option '--active'
      - no workflow, env, or manifest file is written
    cleanup: None.
    expected: covered

  - id: setup-local-missing-list-selector-before-attached-option
    family: setup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: setup-local rejects --active without a value when the next token is an attached option.
    setup: Run-scoped workflow, env, and config paths that do not exist yet.
    action: Run setup-local --non-interactive --board <id> --active --terminal=Released --workflow <workflow> --env <env>.
    assertions:
      - the command fails with setup_failed code=setup_invalid_arguments
      - the message says Expected parameter for option '--active'
      - no workflow, env, or manifest file is written
    cleanup: None.
    expected: covered

  - id: import-board-option-like-list-selector
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: A Trello list literally named --terminal can be selected with an attached --active value.
    setup: Create a disposable board with lists named --terminal and Done.
    action: Run import-board --active=--terminal --terminal Done.
    assertions:
      - import-board exits 0
      - tracker.active_states contains --terminal as a list name
      - tracker.terminal_states contains Done
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: setup-local-option-like-list-selector
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: setup-local treats an attached option-like value as a list name.
    setup: Create a disposable board with lists named --terminal and Done.
    action: Run setup-local --non-interactive --no-start --board <id> --active=--terminal --terminal Done.
    assertions:
      - setup-local exits 0
      - tracker.active_states contains --terminal as a list name
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: import-board-invalid-board-selector
    family: setup
    profiles: [quick, release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: import-board fails cleanly for a board selector that does not exist.
    setup: Run-scoped workflow and env paths.
    action: Run import-board --board <nonexistent short link>.
    assertions:
      - the command exits non-zero with a setup_failed code
      - no workflow or manifest file is written
    cleanup: None.
    expected: covered

  - id: import-board-duplicate-list-selector
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: Passing the same list selector twice fails before any write.
    setup: Create a disposable board with the standard lists.
    action: Run import-board --active "Ready for Codex" --active "Ready for Codex".
    assertions:
      - the command fails with setup_failed code=setup_duplicate_active_state
      - no workflow or manifest file is written
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: setup-local-check-missing-manifest
    family: setup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: setup-local check with a missing manifest reports no boards and creates nothing.
    setup: A run-scoped config dir without a manifest.
    action: Run setup-local check --manifest <missing> --config-dir <config-dir>.
    assertions:
      - the command exits 0 and warns that no Trello boards are connected
      - the missing manifest is not created
    cleanup: None.
    expected: covered

  - id: setup-local-dry-run-all-paths-danger-access
    family: setup
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: setup-local --dry-run with all-path and danger access only describes the plan.
    setup: Run-scoped config dir, workflow, env, and manifest paths that do not exist.
    action: Run setup-local --dry-run --add-path / --allow-all-paths --danger-full-access --no-start.
    assertions:
      - the command exits 0
      - the plan lists WOULD lines for the workflow, manifest, path access, and danger-full-access
      - no file is written and no board is created
    cleanup: None.
    expected: covered

  - id: setup-max-agents-boundary-99-and-100
    family: setup
    profiles: [quick, release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: --max-agents accepts 99 and rejects 100 before any write.
    setup: Two run-scoped workflow paths.
    action: Run setup-local --max-agents 100, then setup-local --max-agents 99.
    assertions:
      - 100 fails with setup_failed code=setup_invalid_max_agents before writing a workflow or creating a board
      - 99 exits 0 and writes agent.max_concurrent_agents 99
    cleanup: Final cleanup archives the created board.
    expected: covered

  - id: guided-setup-local-max-agents
    family: setup
    profiles: [release]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: Guided setup-local asks for Maximum cards processed concurrently and writes the answer.
    setup: Drive setup-local through a pseudo-terminal with run-scoped paths.
    action: Answer the guided prompts, entering a max-agents value.
    assertions:
      - the prompt text is Maximum cards processed concurrently
      - the workflow records the entered value
    cleanup: Final cleanup archives the board.
    expected: covered
    notes: Needs a pseudo-terminal driver; InstallerScriptLifecycleTest shows the pattern.

  - id: guided-import-board-max-agents
    family: setup
    profiles: [release]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: Guided import-board asks for Maximum cards processed concurrently and writes the answer.
    setup: Drive import-board through a pseudo-terminal with run-scoped paths.
    action: Answer the guided prompts, entering a max-agents value.
    assertions:
      - the prompt text is Maximum cards processed concurrently
      - the workflow records the entered value
    cleanup: Final cleanup archives the board.
    expected: covered
    notes: Needs a pseudo-terminal driver.

  - id: setup-local-no-in-progress-dispatch
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: setup-local --no-in-progress creates no In Progress list and runs cards from Ready.
    setup: setup-local --no-in-progress --no-start; start the worker with fake Codex; one card in Ready for Codex.
    action: Let the worker pick the card up and fake Codex hand it off.
    assertions:
      - the workflow has no tracker.in_progress_state and the board has no In Progress list
      - the card reaches Human Review without ever entering In Progress
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered
    linked_issue: 498

  - id: configure-github-preserves-no-in-progress
    family: setup
    profiles: [github-live]
    requires: {trello: true, codex: false, github: true, network: true}
    mode: github-sandbox
    description: configure-github keeps a board without an in-progress list in that shape.
    setup: Connect a board created with --no-in-progress and a private sandbox repository.
    action: Run setup-local configure-github --board <selector>.
    assertions:
      - the workflow still has no tracker.in_progress_state
    cleanup: Archive the board; list the sandbox repository for manual deletion.
    expected: covered

  - id: import-board-no-handoff-destination
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: import-board of a board with only a queue and Done lists writes a workflow without review or blocked lists.
    setup: Create a disposable board with lists Ready for Codex and Done.
    action: Run import-board without explicit selectors.
    assertions:
      - import-board exits 0
      - the workflow has no tracker.blocked_state and allows moves only to Done
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: import-board-terminal-done-handoff
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: On a board without a review list, the handoff to Done is terminal and the card stays there.
    setup: Import a board with Ready for Codex and Done; fake Codex hands off to Done.
    action: Start the worker with one card in Ready for Codex.
    assertions:
      - the card reaches Done
      - the worker does not retry the card after the terminal move
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: setup-local-repair-port-occupied-port
    family: setup
    profiles: [release, trello-live]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: repair-port moves a connected board away from an occupied port.
    setup: Connect a board with setup-local on a free port, then occupy that port.
    action: Run setup-local check, then setup-local repair-port --board <name>.
    assertions:
      - setup-local check reports the occupied port and suggests repair-port
      - repair-port exits 0 and the manifest and workflow use a different free port
    cleanup: Release the port; final cleanup archives the board.
    expected: covered

  - id: setup-local-repair-port-reserved-port-avoidance
    family: setup
    profiles: [release]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: repair-port never picks a port that another connected workflow reserves.
    setup: Connect two boards; occupy the first board's port.
    action: Run setup-local repair-port for the first board.
    assertions:
      - the new port is free and differs from every port in the connected-board manifest
    cleanup: Final cleanup archives the boards.
    expected: covered
    notes: Quarantined repro candidate from the original run; the latest re-probe did not reproduce it. Automate once a deterministic way to force the collision exists.

  # ---------------------------------------------------------------------------------------------
  # Lifecycle, process, and state
  # ---------------------------------------------------------------------------------------------
  - id: start-all-stop-all
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: start --all starts every connected worker and stop drains them all.
    setup: Two connected boards in one run-scoped config dir, both patched to fake Codex.
    action: Run start --all, read /api/v1/state for both, run stop, then status.
    assertions:
      - start --all exits 0 and both state endpoints answer
      - stop exits 0 and status reports both workflows stopped
      - no run-owned worker process remains for these workflows
    cleanup: Final cleanup archives the boards.
    expected: covered

  - id: start-all-stop-one-board
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Stopping one board from start --all leaves the sibling running and working.
    setup: Two connected boards started with start --all.
    action: Run stop --board <first board name>, then add a card to the second board.
    assertions:
      - status reports the first board stopped and the second running
      - the card on the second board reaches Human Review
    cleanup: Stop all workers; final cleanup archives the boards.
    expected: covered

  - id: start-all-two-workflows
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Two workflows started together each process their own card.
    setup: Two connected boards started with start --all, one card on each.
    action: Wait for both cards.
    assertions:
      - each card reaches Human Review on its own board
      - each worker reports the board it was configured for
    cleanup: Stop all workers; final cleanup archives the boards.
    expected: covered

  - id: start-running-workflow-idempotent
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Starting an already running workflow is a no-op.
    setup: One running worker.
    action: Run start --workflow <workflow> again.
    assertions:
      - the second start exits 0 and says the worker is already running
      - the worker pid does not change
    cleanup: Stop the worker.
    expected: covered

  - id: managed-lifecycle-start-status-duplicate-start-stop
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: start, status, duplicate start, stop, and status agree with each other.
    setup: One connected board.
    action: start, status, start again, stop, status.
    assertions:
      - status reports running between start and stop and stopped afterwards
      - the duplicate start does not create a second process
    cleanup: Stop the worker.
    expected: covered

  - id: managed-lifecycle-logs-for-stopped-worker
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: logs still shows the last worker log after the worker stopped.
    setup: Start and stop one worker.
    action: Run logs --workflow <workflow>.
    assertions:
      - logs exits 0 and prints the worker's startup and shutdown lines
    cleanup: None.
    expected: covered

  - id: lifecycle-commands-missing-workflow
    family: lifecycle
    profiles: [quick, release, lifecycle]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: status, logs, and stop reject a missing workflow without creating files.
    setup: A run-scoped config dir and state home; a workflow path that does not exist.
    action: Run status, logs, and stop with --workflow <missing>.
    assertions:
      - each command fails with setup_failed code=setup_invalid_arguments
      - no file is created in the config dir or state home
    cleanup: None.
    expected: covered

  - id: stale-pid-restart-recovery
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: A worker that died without cleanup is reported stopped and can start again.
    setup: Start one worker, then kill its run-owned process with SIGKILL.
    action: Run status, then start again.
    assertions:
      - status reports the workflow stopped instead of running
      - start exits 0 and the new worker answers its state endpoint
    cleanup: Stop the worker.
    expected: covered

  - id: board-url-selector-live
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Lifecycle commands accept a board URL selector.
    setup: One connected, running board.
    action: Run status --board <board url>.
    assertions:
      - status exits 0 and reports exactly the selected board as running
    cleanup: Stop the worker.
    expected: covered

  - id: duplicate-board-name-selector
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: false, github: false, network: false}
    mode: trello-cli
    description: A board-name selector that matches two connected boards fails before any process starts.
    setup: Two disposable boards with the same name, both imported into one manifest.
    action: Run start --board "<shared name>".
    assertions:
      - start fails with setup_failed and an ambiguous-board code
      - no pid file is created
    cleanup: Final cleanup archives the boards.
    expected: covered
    notes: The original run saw code setup_ambiguous_board_selector; current releases print setup_worker_board_ambiguous.

  - id: board-name-selector-unicode
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Lifecycle commands select a board by a Unicode board name.
    setup: One connected board whose name contains non-ASCII characters.
    action: Run start --board "<unicode name>", status --board, stop --board.
    assertions:
      - start, status, and stop exit 0 for the Unicode selector
    cleanup: Stop the worker.
    expected: covered

  - id: invalid-workflow-reload-keeps-last-known-good
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: An invalid workflow edit while running keeps the last known good configuration.
    setup: One running worker.
    action: Break the workflow front matter, wait for a reload, add a card, then restore the file.
    assertions:
      - the worker keeps answering /api/v1/state
      - the worker log records the rejected reload
      - a card added after the bad edit still reaches Human Review
    cleanup: Restore the workflow; stop the worker.
    expected: covered

  - id: state-api-codex-usage-and-rate-limit-telemetry
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Token usage and rate-limit telemetry from Codex appear in /api/v1/state.
    setup: Fake Codex sends thread/tokenUsage/updated and account/rateLimits/updated before handing off.
    action: Run one card and read /api/v1/state.
    assertions:
      - codex_totals counts the reported tokens
      - rate_limits shows the reported primary window
    cleanup: Stop the worker.
    expected: covered

  - id: archive-in-progress-list-while-running
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Archiving the in-progress list while a card runs there stops the run without churn.
    setup: A stalled fake Codex turn keeps a card in In Progress.
    action: Archive the In Progress list.
    assertions:
      - the worker stops the agent and does not retry the card
      - no app-server process remains
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: archive-review-destination-while-running
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Archiving the review list during a run makes the handoff fail truthfully.
    setup: A running card whose handoff targets Human Review.
    action: Archive Human Review before fake Codex moves the card.
    assertions:
      - the move fails with a truthful tool error and the card is not lost
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: external-terminal-move-while-worker-running
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: A human moving a running card to Done stops its agent without retry.
    setup: A stalled fake Codex turn keeps a card running.
    action: Move the card to Done through the Trello API.
    assertions:
      - the state API drops the card from running without a retry entry
      - no fake app-server process for the card remains
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: external-non-active-move-while-worker-running
    family: lifecycle
    profiles: [release, trello-live, lifecycle]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: A human moving a running card to a non-active list stops its agent without retry.
    setup: A stalled fake Codex turn keeps a card running.
    action: Move the card to Human Review through the Trello API.
    assertions:
      - the state API drops the card from running without a retry entry
      - no fake app-server process for the card remains
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  # ---------------------------------------------------------------------------------------------
  # Repository source selection
  # ---------------------------------------------------------------------------------------------
  - id: repository-source-no-source-real-codex
    family: repository-source
    profiles: [real-codex, repository-source]
