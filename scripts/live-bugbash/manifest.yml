  # ---------------------------------------------------------------------------------------------
  # Diagnostics and private context
  # ---------------------------------------------------------------------------------------------
  - id: diagnostics-focused-lookup-for-emitted-path-tokens
    family: diagnostics
    profiles: [quick, release, trello-live]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
    description: Every <path:...> token in a diagnostics report resolves through a focused lookup.
    setup: A connected board whose worker ran once, so the report includes worker log excerpts.
    action: Run diagnostics --workflow, then diagnostics --show-private-context --lookup for every emitted path token.
    assertions:
      - every emitted path token returns lookup_status found
    cleanup: Stop the worker; final cleanup archives the board.
    expected: known-bug
    linked_issue: 803
    notes: "#494 fixed the installer metadata tokens. #803 tracks the remaining misses: worker log lines whose path swallows the rest of the line, and the Podman docker-shim notice in the tool table."

  - id: diagnostics-lookup-negative-paths
    family: diagnostics
    profiles: [quick, release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: Focused lookups report invalid and unknown tokens, and require --show-private-context.
    setup: A run-scoped config dir.
    action: Look up a malformed token, an unknown token, and a token without --show-private-context.
    assertions:
      - the malformed token reports lookup_status invalid_token
      - the unknown token reports lookup_status not_found
      - --lookup without --show-private-context fails with setup_failed code=setup_invalid_arguments
    cleanup: None.
    expected: covered

  - id: diagnostics-deep-stopped-workflow
    family: diagnostics
    profiles: [release, trello-live]
    requires: {trello: true, codex: fake, github: false, network: false}
