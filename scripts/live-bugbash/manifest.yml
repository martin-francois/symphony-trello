    description: diagnostics --deep --json works for a stopped workflow.
    setup: A connected board whose worker is stopped.
    action: Run diagnostics --deep --json --workflow <workflow> --output <private-evidence>.
    assertions:
      - diagnostics exits 0 and writes a JSON report
      - the report tokenizes run-root paths instead of printing them
    cleanup: Final cleanup archives the board.
    expected: covered

  - id: diagnostics-deep-running-worker
    family: diagnostics
    profiles: [release, trello-live]
    requires: {trello: true, codex: fake, github: false, network: false}
    mode: service-fake-codex
