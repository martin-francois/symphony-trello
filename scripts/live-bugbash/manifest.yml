    setup: A connected board with a running worker.
    action: Run diagnostics --deep --json --workflow <workflow> --output <private-evidence>.
    assertions:
      - the worker was running before diagnostics
      - diagnostics exits 0, writes JSON, and mentions the worker status
      - the report tokenizes run-root paths instead of printing them
    cleanup: Stop the worker; final cleanup archives the board.
    expected: covered

  - id: missing-secret-file-launch-diagnostics
    family: diagnostics
    profiles: [release]
    requires: {trello: false, codex: false, github: false, network: false}
    mode: deterministic-cli
    description: A missing file-backed secret fails before launch with a resolvable lookup hint.
    setup: A workflow outside the config dir whose tracker.api_token is file:./missing-token.txt.
    action: Run start --workflow <workflow>, then the printed lookup command through the install config dir.
    assertions:
      - start fails before launch and prints secret_file_token with a quoted lookup command
      - public output has no raw secret file path
      - the printed lookup resolves the token as secret_file
      - no diagnostics key is created in the workflow directory
    cleanup: None.
    expected: known-bug
    linked_issue: 804
    notes: The printed lookup resolves only with an added --workflow selector when the workflow is not connected.

